openapi: 3.1.0
info:
  title: PACE AI Hub API
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /readyz:
    get:
      tags:
      - health
      summary: Readyz
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
components:
  schemas:
    Liveness:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: Liveness
    Readiness:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
        checks:
          additionalProperties:
            type: string
            enum:
            - ok
            - down
          type: object
          title: Checks
      type: object
      required:
      - status
      - checks
      title: Readiness
