[project]
name = "pace-worker"
version = "0.1.0"
description = "PACE AI Hub background worker (Celery on Valkey)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]==5.6.3",
    # Shared settings/models/logging with the API (AGENTS.md: single source).
    "pace-api",
]

[tool.uv.sources]
pace-api = { path = "../api", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "testcontainers==4.15.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.isort]
# `app` is the API package from this monorepo, shared via path dependency.
known-first-party = ["app", "worker"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["worker"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers Valkey)"]
