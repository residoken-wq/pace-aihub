[project]
name = "pace-api"
version = "0.1.0"
description = "PACE AI Hub API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.150.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "structlog==26.1.0",
    "httpx==0.28.1",
    # Capped by kombu (Celery broker) which requires redis<6.5.
    "redis==6.4.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "testcontainers[postgres]==4.15.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers Postgres/Valkey)"]
