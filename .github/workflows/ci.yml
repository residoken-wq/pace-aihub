name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Lint formatting (ruff format)
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Lint code (ruff check)
        working-directory: apps/api
        run: uv run ruff check .

      - name: Type check (mypy)
        working-directory: apps/api
        run: uv run mypy

      - name: Run unit & integration tests (pytest)
        working-directory: apps/api
        run: uv run pytest -q -rs --junitxml=pytest.xml

      - name: Ensure no tests were skipped
        working-directory: apps/api
        run: python3 -c "import xml.etree.ElementTree as E,sys; s=sum(int(t.get('skipped',0)) for t in E.parse('pytest.xml').iter('testsuite')); print('skipped',s); sys.exit(1 if s else 0)"

  worker:
    name: Worker Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/worker
        run: uv sync --frozen

      - name: Lint formatting (ruff format)
        working-directory: apps/worker
        run: uv run ruff format --check .

      - name: Lint code (ruff check)
        working-directory: apps/worker
        run: uv run ruff check .

      - name: Type check (mypy)
        working-directory: apps/worker
        run: uv run mypy

      - name: Run unit & integration tests (pytest)
        working-directory: apps/worker
        run: uv run pytest -q -rs --junitxml=pytest.xml

      - name: Ensure no tests were skipped
        working-directory: apps/worker
        run: python3 -c "import xml.etree.ElementTree as E,sys; s=sum(int(t.get('skipped',0)) for t in E.parse('pytest.xml').iter('testsuite')); print('skipped',s); sys.exit(1 if s else 0)"

  migrations:
    name: Database Migrations Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass_${{ github.run_id }}
          POSTGRES_DB: pace_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Run alembic migrations (upgrade head -> downgrade base -> upgrade head)
        working-directory: apps/api
        env:
          PACE_DATABASE_URL: postgresql+asyncpg://test_user:test_pass_${{ github.run_id }}@127.0.0.1:5432/pace_migration_test
          PACE_VALKEY_URL: redis://127.0.0.1:6379/0
          PACE_ENV: dev
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  contracts:
    name: API Contracts Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install api dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate contracts and check git diff
        run: |
          pnpm contracts:gen
          git diff --exit-code packages/contracts

  web:
    name: Web Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm -C apps/web lint

      - name: Type check (tsc)
        run: pnpm -C apps/web typecheck

      - name: Unit & Component tests (vitest)
        run: pnpm -C apps/web test

      - name: Build Next.js application
        run: pnpm -C apps/web build

  security:
    name: Security Scans (Gitleaks, pnpm audit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository (full history for gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks CLI binary
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz
          gitleaks version

      - name: Run Gitleaks detect
        run: gitleaks detect --verbose

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Run pnpm audit (production)
        run: pnpm audit --prod

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run pip-audit for API & Worker
        run: |
          cd apps/api
          uv export --frozen --no-dev --no-emit-project --no-emit-local -o req.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps -r req.txt
          rm -f req.txt
          cd ../worker
          uv export --frozen --no-dev --no-emit-project --no-emit-local -o req.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps -r req.txt
          rm -f req.txt

  e2e:
    name: End-to-End Tests (Docker Compose & Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate temporary .env with random credentials
        run: |
          POSTGRES_PASS=$(openssl rand -hex 16)
          cat <<EOF > .env
          POSTGRES_USER=dev_user
          POSTGRES_PASSWORD=${POSTGRES_PASS}
          POSTGRES_DB=pace_dev
          PACE_LOG_LEVEL=INFO
          PACE_ENV=dev
          PACE_DATABASE_URL=postgresql+asyncpg://dev_user:${POSTGRES_PASS}@127.0.0.1:5432/pace_dev
          PACE_VALKEY_URL=redis://127.0.0.1:6379/0
          API_INTERNAL_URL=http://127.0.0.1:8000
          EOF

      - name: Start Docker Compose dev stack
        run: docker compose -f infra/docker-compose.dev.yml --env-file .env up -d --build --wait

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers with OS dependencies
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: pnpm -C apps/web e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Tear down Docker Compose
        if: always()
        run: |
          docker compose -f infra/docker-compose.dev.yml --env-file .env down -v
          rm -f .env
